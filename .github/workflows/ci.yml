name: MRAG quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install --require-hashes -r requirements-dev.lock && pip install --no-deps .
      - run: ruff check src tests scripts workers migrations
      - run: ruff format --check src tests scripts workers migrations
      - run: mypy src
      - run: pytest -q -m 'not integration'
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci && npm test && npm run build
        working-directory: apps/web
  services:
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.8-alpine
        env: {POSTGRES_USER: atlas, POSTGRES_PASSWORD: ci-disposable, POSTGRES_DB: atlas}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U atlas -d atlas" --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4.2-alpine
        ports: ['6379:6379']
    env:
      ATLAS_INTEGRATION_DATABASE_URL: postgresql+psycopg://atlas:ci-disposable@localhost:5432/atlas
      ATLAS_INTEGRATION_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --require-hashes -r requirements-dev.lock && pip install --no-deps .
      - run: pytest -q -m integration
  containers:
    needs: services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/bootstrap.py
      - run: docker compose config --quiet && docker compose build
      - run: docker compose up -d --wait --wait-timeout 180
      - run: docker compose exec -T api python scripts/smoke.py
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down -v
