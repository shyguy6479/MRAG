[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "atlasrag"
version = "0.1.0"
description = "MRAG — an inspectable, bounded agentic research system"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "celery[redis]>=5.4,<6", "redis>=6,<7",
  "httpx>=0.28,<1", "numpy>=2.2,<3", "scikit-learn>=1.6,<2",
  "rank-bm25>=0.2.2,<0.3", "pypdf>=5,<7", "beautifulsoup4>=4.13,<5",
  "python-multipart>=0.0.20,<1", "prometheus-client>=0.21,<1",
  "opentelemetry-api>=1.30,<2", "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2", "alembic>=1.15,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML>=6", "pyyaml>=6,<7"]
neural = ["sentence-transformers>=3.4,<6", "qdrant-client>=1.13,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/atlasrag"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["apps/web", "migrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: tests that use a running deployed stack"]

[tool.vercel]
entrypoint = "app.main:app"
